name: Build Aril eFootball
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"'
      - name: Build and verify ARM64
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Aril-eFootball-Magisk
          path: dist/Aril-eFootball-Personal-arm64.zip
          if-no-files-found: error
